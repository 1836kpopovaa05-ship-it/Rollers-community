                    <p>Катание на роликах становится все более популярным. Однако далеко не все райдеры знают, как правильно ухаживать за коньками, чтобы они служили как можно дольше. Ходовая часть роликов изнашивается от попадания внутрь грязи, песка, воды из луж. Колеса неравномерно стираются, оси прикипают, внутренник пропитывается потом.</p>
                    <p>Регулярный своевременный уход продлевает срок службы деталей. Чистые смазанные коньки хорошо катятся и не вызывают у роллера дискомфорта.</p>

                        <li>Оставьте на 10–15 минут, затем снова встряхните.</li>
                        <li>На палочку наденьте подшипник и опустите в бензин, прокручивая его до полного очищения.</li>
                        <li>Промойте пыльники и стопорные кольца.</li>
                        <li>Выложите все детали на чистую бумагу или ткань для просушки.</li>
                    </ol>
                    <p>Отработанный бензин слейте в отдельную бутылку — он пригодится для следующей чистки (после отстаивания осадка чистый слой можно использовать повторно 5–7 раз).</p>
                    <h3>Смазка подшипников</h3>
                    <p>После полной просушки можно приступать к смазке. Для обработки подшипников применяют:</p>
                    <ul>
                        <li><strong>Пластичные составы (Grease)</strong> — производятся на литиевой основе. Обладают большей вязкостью, обеспечивают больший ресурс и лучше защищают от пыли и грязи. Рекомендуется использовать ЛИТОЛ-24 или зарубежные аналоги.</li>
                        <li><strong>Жидкие смазки (Oil)</strong> — обеспечивают максимальную лёгкость вращения, но требуют частого обслуживания (каждые 60–100 км). Подходят для подшипников класса ABEC 5 и выше.</li>
                    </ul>
                    <div class="info-box">
                        <p>⚠️ Не рекомендуется самостоятельно смешивать разные типы смазок или добавлять смазку поверх старой — лучше полностью промыть подшипник и нанести свежую смазку (около 30% от внутреннего объёма). Не переусердствуйте с количеством — избыток смазки ухудшает вращение и повышает износ.</p>
                    </div>
                    <h3>Уход за колесами</h3>
                    <p>Перед установкой колёс на раму оцените их износ. Ротация (перестановка) колёс продлевает их срок службы, возвращает роликам маневренность и скорость.</p>
                    <ul>
                        <li><strong>Перекрёстная схема</strong> — самый распространённый способ, увеличивает ресурс колёс примерно на 30%. Подходит при равномерной нагрузке на все колёса.</li>
                        <li><strong>Индивидуальная схема</strong> — при неравномерном износе (например, при длительном катании с упором на одну сторону) колёса сортируют по размеру и переставляют самые изношенные на 1 позицию.</li>
                    </ul>
                    <h3>Уход за ботинками</h3>
                    <p>Во время катания на ботинках оседает пыль, остаются следы грязи и травы. Чтобы они долго сохраняли аккуратный вид:</p>
                    <ul>
                        <li>Пластиковые части достаточно протирать влажной тряпкой после каждой поездки.</li>
                        <li>Лайнеры (внутренние ботинки) рекомендуется регулярно сушить и при необходимости стирать согласно инструкции производителя.</li>
                        <li>Храните ролики в сухом месте, избегайте длительного воздействия прямых солнечных лучей и влаги.</li>
                    </ul>
                    <div class="info-box">
                        <p>Своевременный уход за роликами — залог долгой и безопасной езды. Уделяйте конькам немного внимания, и они отблагодарят вас комфортным катанием!</p>
                    </div>
                `
            }
        ];
